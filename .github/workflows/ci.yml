name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  YAEGI_VERSION: v0.16.1
  MODULE_PATH: github.com/alteos-gmbh/traefik-plugin-request-id

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    # Go deliberately comes from the official image rather than the org's
    # build/go image. That one is FROM golang:alpine and only rebuilds when its
    # own Dockerfile changes, so the Go version it carries is frozen at whenever
    # that last happened and cannot be pinned from here. Debian-based rather
    # than Alpine, so the Node the runner injects for JavaScript actions has the
    # glibc it needs.
    container:
      image: golang:1.26

    steps:
      # Yaegi resolves imports through GOPATH, so the sources must sit at
      # $GOPATH/src/<module path> for the interpreter check below.
      - name: Check out into GOPATH
        uses: actions/checkout@v6
        with:
          path: go/src/${{ env.MODULE_PATH }}
          # This job runs pull request code and no step needs git auth, so do
          # not leave GITHUB_TOKEN in the local git config.
          persist-credentials: false

      # The container runs as root over a workspace the runner created, which
      # git otherwise refuses to read.
      - name: Trust the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}/go/src/${MODULE_PATH}"

      - name: Check formatting
        working-directory: go/src/${{ env.MODULE_PATH }}
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: go/src/${{ env.MODULE_PATH }}
        run: go vet -mod=vendor ./...

      - name: Test
        working-directory: go/src/${{ env.MODULE_PATH }}
        run: go test -mod=vendor -v -cover ./...

      # Traefik never compiles plugins, it interprets them with Yaegi. Code that
      # passes go build can still fail to load at runtime, so run the suite under
      # the interpreter as well.
      - name: Install Yaegi
        run: GOBIN=/usr/local/bin go install github.com/traefik/yaegi/cmd/yaegi@${{ env.YAEGI_VERSION }}

      - name: Yaegi test
        working-directory: go/src/${{ env.MODULE_PATH }}
        env:
          GOPATH: ${{ github.workspace }}/go
        # The import path is required here; "yaegi test ." cannot resolve the
        # vendored dependencies. The yaegi tag excludes tests the interpreter
        # cannot run; see entropy_test.go.
        run: yaegi test -tags yaegi -v ${{ env.MODULE_PATH }}

      # Traefik requires dependencies to be vendored, so the committed tree must
      # stay in sync with go.mod.
      - name: Check vendor tree is up to date
        working-directory: go/src/${{ env.MODULE_PATH }}
        run: |
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor/ || {
            echo "vendor/ is out of sync with go.mod; run 'go mod vendor' and commit the result"
            exit 1
          }

  manifest:
    name: Manifest
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      # Needed to pull the image from the org's private GHCR registry.
      packages: read
    container:
      image: ghcr.io/alteos-gmbh/docker-images/build/python:latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # A malformed .traefik.yml, or an import path that does not match the
      # module path, breaks plugin loading with an error that is awkward to
      # debug inside Traefik.
      - name: Validate .traefik.yml
        run: |
          python3 - <<'PY'
          import sys
          import yaml

          with open(".traefik.yml") as fh:
              manifest = yaml.safe_load(fh)

          with open("go.mod") as fh:
              module = next(
                  line.split()[1] for line in fh if line.startswith("module ")
              )

          errors = []
          for field in ("displayName", "type", "import", "summary", "testData"):
              if not manifest.get(field):
                  errors.append(f"missing required field: {field}")

          if manifest.get("type") != "middleware":
              errors.append(f"type is {manifest.get('type')!r}, want 'middleware'")

          if manifest.get("import") != module:
              errors.append(
                  f"import is {manifest.get('import')!r} but go.mod declares {module!r}"
              )

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"manifest OK, import matches module path: {module}")
          PY
