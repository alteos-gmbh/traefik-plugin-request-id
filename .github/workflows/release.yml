name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Release this exact version (e.g. v1.2.0) instead of deriving it from the commits"
        required: false
        type: string

env:
  YAEGI_VERSION: v0.16.1
  MODULE_PATH: github.com/alteos-gmbh/traefik-plugin-request-id

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never publish a version that cannot load. Consumers pin to these tags, and a
  # broken one is awkward to withdraw once anyone has fetched it.
  #
  # This job executes the merged code, so it holds contents: read only. The
  # write-capable token lives in publish, which executes none of it.
  test:
    name: Test
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: golang:1.26

    steps:
      - name: Check out into GOPATH
        uses: actions/checkout@v7
        with:
          path: go/src/${{ env.MODULE_PATH }}
          persist-credentials: false

      - name: Test
        working-directory: go/src/${{ env.MODULE_PATH }}
        run: go test -mod=vendor -v ./...

      - name: Install Yaegi
        run: GOBIN=/usr/local/bin go install github.com/traefik/yaegi/cmd/yaegi@${{ env.YAEGI_VERSION }}

      - name: Yaegi test
        working-directory: go/src/${{ env.MODULE_PATH }}
        env:
          GOPATH: ${{ github.workspace }}/go
        run: yaegi test -tags yaegi -v ${{ env.MODULE_PATH }}

  version:
    name: Decide version
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: golang:1.26

    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The script reads the tags and the commits since the most recent one.
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Decide version
        id: decide
        env:
          FORCE_VERSION: ${{ inputs.version }}
        run: .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

  # Deliberately does not check the repository out, so the write-capable token is
  # never exposed to the merged code. The releases API creates the tag at
  # target_commitish itself, so there is nothing to push. It calls the API
  # directly rather than through gh, which is absent from the runner image.
  publish:
    name: Publish
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      image: golang:1.26
    needs:
      - test
      - version
    if: needs.version.outputs.release == 'true'

    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          payload=$(python3 -c '
          import json, os
          print(json.dumps({
              "tag_name": os.environ["VERSION"],
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": os.environ["VERSION"],
              "generate_release_notes": True,
          }))')

          # --fail-with-body so a rejected request both fails the step and shows
          # why. The response is captured rather than piped: piping into the
          # parser would replace the API's explanation with a KeyError traceback.
          if ! response=$(curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -d "$payload"); then
            echo "creating the release failed, the API said:" >&2
            echo "$response" >&2
            exit 1
          fi

          printf '%s' "$response" |
            python3 -c 'import json, sys; print("released:", json.load(sys.stdin)["html_url"])'

  # Publishes the init-container image (see Dockerfile) that carries this
  # plugin's source, for clusters that copy plugins-local/ onto a shared
  # volume instead of baking them into a custom Traefik image. Unlike
  # publish above, this job checks the repository out: packages: write is a
  # separate scope from contents: write, so giving it the merged code does
  # not expose the token that can create releases.
  image:
    name: Publish image
    runs-on: codebuild-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    needs:
      - test
      - version
    if: needs.version.outputs.release == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
